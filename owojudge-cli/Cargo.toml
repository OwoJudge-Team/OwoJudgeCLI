[package]
name = "owojudge-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
directories = "5.0"
dialoguer = "0.11"
console = "0.15"
tabled = "0.15"
config = "0.14"
ratatui = "0.29.0"
crossterm = "0.29.0"
textwrap = "0.16.2"
